<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gallery · West Philadelphia Sanctuary</title>
  <meta name="description" content="Photos from West Philadelphia Sanctuary events." />
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" href="/icon-32.png?v=2" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/site.css" />
</head>
<body>
  <header id="siteHeader"></header>

  <main class="page">
    <div class="page-head">
      <p class="eyebrow">Gallery</p>
      <h1>Moments from past events</h1>
      <p>A look back at the people and places that make West Philly feel like home.</p>
    </div>
    <div id="albums"></div>
  </main>

  <dialog id="lightbox" class="lightbox">
    <button class="icon-btn lb-close" data-close aria-label="Close"><span class="icon" data-icon="x"></span></button>
    <button class="icon-btn lb-prev" id="lbPrev" aria-label="Previous photo"><span class="icon" data-icon="chevronLeft"></span></button>
    <img id="lbImg" alt="" />
    <p class="lb-caption" id="lbCaption"></p>
    <button class="icon-btn lb-next" id="lbNext" aria-label="Next photo"><span class="icon" data-icon="chevronRight"></span></button>
  </dialog>

  <footer class="site-footer" id="siteFooter"></footer>
  <script type="module" src="/pages/gallery.js"></script>
</body>
</html>
