<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Events · West Philadelphia Sanctuary</title>
  <meta name="description" content="Upcoming events from the West Philadelphia Sanctuary. RSVP or let us know you're interested." />
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" href="/icon-32.png?v=2" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/site.css" />
</head>
<body>
  <header id="siteHeader"></header>

  <main class="page">
    <div class="page-head">
      <div class="row-between">
        <div>
          <p class="eyebrow">Events</p>
          <h1>What’s happening</h1>
          <p>Gatherings around West Philly, open to students and neighbors. RSVP so we know how many to expect.</p>
        </div>
        <div class="events-toolbar">
          <div class="view-switch" id="viewSwitch" role="group" aria-label="View">
            <button data-view="list"><span class="icon" data-icon="list"></span>List</button>
            <button data-view="calendar"><span class="icon" data-icon="calendar"></span>Calendar</button>
          </div>
          <a class="btn btn-outline btn-small" href="/api/calendar.ics" title="Download or subscribe to all club events in your calendar app">
            <span class="icon" data-icon="download"></span>Add all to calendar
          </a>
        </div>
      </div>
    </div>

    <section id="upcomingView"></section>

    <section class="section-block" id="pastSection" hidden>
      <div class="section-head"><h2>Past events</h2><a class="more-link" href="/gallery">Photos <span class="icon" data-icon="arrowRight"></span></a></div>
      <div class="event-grid" id="pastList"></div>
    </section>
  </main>

  <dialog id="eventDialog" class="dialog event-dialog">
    <div class="ev-wrap" id="eventBody"></div>
  </dialog>

  <footer class="site-footer" id="siteFooter"></footer>
  <script type="module" src="/pages/events.js"></script>
</body>
</html>
